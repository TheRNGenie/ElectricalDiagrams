name: Compile sketches

# Builds every sketch for the UNO R4 WiFi and commits the .bin files to bin/,
# so the page can flash them to the board from a phone.
on:
  push:
    branches: [main]
    paths: ['sketches/**', '.github/workflows/compile.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install board core and libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:renesas_uno
          arduino-cli lib install "DHT sensor library" "Adafruit Unified Sensor" "Adafruit SSD1306" "Adafruit GFX Library" "IRremote" "MFRC522" "Keypad" "Servo" "Stepper"
      - name: Compile
        run: |
          mkdir -p bin
          status=0
          for dir in sketches/*/; do
            name=$(basename "$dir")
            echo "::group::$name"
            if arduino-cli compile --fqbn arduino:renesas_uno:unor4wifi --output-dir "build/$name" "$dir"; then
              cp "build/$name/$name.ino.bin" "bin/$name.bin"
            else
              echo "::error::$name failed to compile"; status=1
            fi
            echo "::endgroup::"
          done
          ls -l bin
          exit $status
      - name: Commit binaries
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin
          git diff --cached --quiet || (git commit -m "Update compiled sketches [skip ci]" && git push)
